<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Quantum Computing Course logo">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e0b4b"/>
      <stop offset="0.55" stop-color="#4c1d95"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f0abfc"/>
      <stop offset="1" stop-color="#f0abfc" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#g)"/>
  <!-- Bloch sphere -->
  <circle cx="32" cy="33" r="19" fill="#ffffff14" stroke="#ffffffd9" stroke-width="2"/>
  <path d="M13 33 A19 6.5 0 0 0 51 33" fill="none" stroke="#ffffffd9" stroke-width="1.6"/>
  <path d="M13 33 A19 6.5 0 0 1 51 33" fill="none" stroke="#ffffff73" stroke-width="1.4" stroke-dasharray="2.5 2.5"/>
  <line x1="32" y1="14" x2="32" y2="52" stroke="#ffffff59" stroke-width="1.2" stroke-dasharray="2 2.5"/>
  <!-- state vector |ψ⟩ -->
  <circle cx="44.5" cy="20.5" r="7" fill="url(#glow)" opacity="0.7"/>
  <line x1="32" y1="33" x2="44.5" y2="20.5" stroke="#22d3ee" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="44.5" cy="20.5" r="3.6" fill="#f0abfc" stroke="#fff" stroke-width="1.2"/>
  <circle cx="32" cy="33" r="2" fill="#fff"/>
</svg>
